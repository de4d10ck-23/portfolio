<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720" fill="none">
  <defs>
    <linearGradient id="suit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>
  <!-- Floating Card Frame -->
  <rect x="70" y="50" width="500" height="620" rx="40" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
  <rect x="92" y="72" width="456" height="440" rx="28" fill="#f8fafc" stroke="#f1f5f9"/>

  <!-- Subtle Grid in Portrait Card -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="92" y1="180" x2="548" y2="180"/>
    <line x1="92" y1="290" x2="548" y2="290"/>
    <line x1="92" y1="400" x2="548" y2="400"/>
    <line x1="240" y1="72" x2="240" y2="512"/>
    <line x1="400" y1="72" x2="400" y2="512"/>
  </g>

  <!-- Glowing Halo -->
  <circle cx="320" cy="275" r="145" fill="#dbeafe" fill-opacity="0.7"/>
  <circle cx="320" cy="275" r="115" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Stylized Developer Avatar Silhouette -->
  <!-- Shoulders / Hoodie-Blazer -->
  <path d="M165 512 C165 415 230 375 320 375 C410 375 475 415 475 512 Z" fill="url(#suit)"/>
  <!-- Collar / Inner Shirt -->
  <path d="M275 378 L320 445 L365 378 Z" fill="#2563eb"/>
  <!-- Neck -->
  <rect x="292" y="325" width="56" height="62" rx="22" fill="#f1c27d"/>
  <!-- Head -->
  <rect x="242" y="175" width="156" height="175" rx="72" fill="#f5cba7"/>
  <!-- Hair -->
  <path d="M238 242 C238 170 275 148 325 148 C378 148 404 176 402 242 C390 205 362 194 320 194 C278 194 252 208 238 242 Z" fill="#0f172a"/>
  <!-- Glasses -->
  <rect x="266" y="242" width="44" height="30" rx="8" fill="#1e293b" fill-opacity="0.1" stroke="#0f172a" stroke-width="4"/>
  <rect x="330" y="242" width="44" height="30" rx="8" fill="#1e293b" fill-opacity="0.1" stroke="#0f172a" stroke-width="4"/>
  <line x1="310" y1="255" x2="330" y2="255" stroke="#0f172a" stroke-width="4"/>
  <!-- Eyes -->
  <circle cx="288" cy="257" r="4.5" fill="#0f172a"/>
  <circle cx="352" cy="257" r="4.5" fill="#0f172a"/>
  <!-- Confident Smile -->
  <path d="M298 302 Q320 318 342 302" stroke="#0f172a" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Laptop Base in Front -->
  <rect x="210" y="438" width="220" height="74" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <circle cx="320" cy="475" r="10" fill="#38bdf8"/>

  <!-- Bottom Name & Verification Pill -->
  <text x="320" y="562" fill="#111827" font-family="Inter, sans-serif" font-size="22" font-weight="900" text-anchor="middle">JOHN LLOYD T. TORTOR</text>
  <text x="320" y="588" fill="#2563eb" font-family="Inter, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2" text-anchor="middle">BSIT-4 PROGRAMMING · FULL-STACK &amp; IOT</text>

  <!-- Mini Badges Row -->
  <rect x="115" y="608" width="128" height="36" rx="18" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="179" y="631" fill="#1d4ed8" font-family="Inter, sans-serif" font-size="11" font-weight="800" text-anchor="middle">🏆 1st Place IT</text>

  <rect x="256" y="608" width="128" height="36" rx="18" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="320" y="631" fill="#047857" font-family="Inter, sans-serif" font-size="11" font-weight="800" text-anchor="middle">🚀 Pixefy ₱9K+</text>

  <rect x="397" y="608" width="128" height="36" rx="18" fill="#fef3c7" stroke="#fde68a"/>
  <text x="461" y="631" fill="#b45309" font-family="Inter, sans-serif" font-size="11" font-weight="800" text-anchor="middle">🔥 60K+ TikTok</text>
</svg>

