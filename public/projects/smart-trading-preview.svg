<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="760" fill="url(#bgGrad)"/>

  <!-- Candlestick chart grid in background -->
  <g stroke="#334155" stroke-opacity="0.25" stroke-width="1">
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="160" y1="0" x2="160" y2="760"/>
    <line x1="320" y1="0" x2="320" y2="760"/>
    <line x1="480" y1="0" x2="480" y2="760"/>
    <line x1="640" y1="0" x2="640" y2="760"/>
    <line x1="800" y1="0" x2="800" y2="760"/>
    <line x1="960" y1="0" x2="960" y2="760"/>
    <line x1="1120" y1="0" x2="1120" y2="760"/>
  </g>

  <!-- Stylized Intraday Trend Line -->
  <path d="M60 480 Q 220 540 380 430 T 700 320 T 980 210 T 1140 140" stroke="url(#cyanGlow)" stroke-width="4" fill="none"/>
  <path d="M60 480 Q 220 540 380 430 T 700 320 T 980 210 T 1140 140 L 1140 760 L 60 760 Z" fill="url(#cyanGlow)" fill-opacity="0.04"/>

  <!-- Floating Glow Card -->
  <rect x="70" y="50" width="1060" height="660" rx="24" fill="#0b1120" fill-opacity="0.88" stroke="#334155" stroke-width="1.5"/>

  <!-- Left: Logo Presentation Card -->
  <rect x="110" y="100" width="380" height="560" rx="20" fill="#ffffff" fill-opacity="0.03" stroke="#1e293b"/>
  <image href="/projects/smart-trading.png" x="150" y="150" width="300" height="300"/>
  <rect x="140" y="490" width="320" height="40" rx="10" fill="#0f172a" stroke="#06b6d4" stroke-opacity="0.4"/>
  <text x="300" y="515" fill="#38bdf8" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">MT5 &amp; Telegram Auto-Execution Engine</text>
  <text x="300" y="550" fill="#94a3b8" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Official MQL5 Marketplace Product #180408</text>

  <!-- Right: Trading Console & Grok AI Engine Visuals -->
  <g transform="translate(520, 100)">
    <!-- Terminal Window -->
    <rect width="580" height="560" rx="20" fill="#030712" stroke="#1f2937" stroke-width="1.5"/>
    
    <!-- Window Header -->
