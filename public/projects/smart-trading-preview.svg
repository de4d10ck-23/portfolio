      <rect x="0" y="0" width="220" height="28" rx="6" fill="#065f46" fill-opacity="0.3" stroke="#10b981" stroke-width="1"/>
      <circle cx="14" cy="14" r="4" fill="#10b981"/>
      <text x="28" y="18" fill="#34d399" font-weight="700">STATUS: INTRADAY AUTO ACTIVE</text>

      <!-- Timezone -->
      <rect x="235" y="0" width="160" height="28" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
      <text x="245" y="18" fill="#a5b4fc" font-weight="600">TIME: Asia/Manila</text>

      <!-- Model -->
      <rect x="408" y="0" width="124" height="28" rx="6" fill="#18181b" stroke="#71717a" stroke-width="1"/>
      <text x="418" y="18" fill="#e4e4e7" font-weight="700">AI: GROK MODEL</text>

      <!-- Command / Output Preview -->
      <text x="0" y="60" fill="#60a5fa">&gt; /ai_result XAUUSD</text>
      <text x="0" y="84" fill="#94a3b8">[H4 / H1 / M15 / M5] Multi-timeframe structure: BULLISH</text>
      <text x="0" y="104" fill="#94a3b8">ATR Volatility: 18.4 pts · Session Liquidity Sweep: VALIDATED</text>
      <text x="0" y="124" fill="#4ade80">&gt;&gt; DECISION: BUY @ 2684.20 | TP: 2702.60 (ATR 1:2.4) | SL: 2676.50</text>

      <!-- Line separator -->
      <line x1="0" y1="145" x2="532" y2="145" stroke="#1f2937" stroke-width="1"/>

      <!-- Telegram commands box -->
      <text x="0" y="175" fill="#f59e0b" font-weight="700">TELEGRAM COMMANDS INTEGRATION:</text>
      
      <rect x="0" y="190" width="255" height="50" rx="8" fill="#111827" stroke="#374151"/>
      <text x="12" y="210" fill="#38bdf8" font-weight="700">/quick</text>
      <text x="12" y="228" fill="#9ca3af" font-size="11">Fast dashboard (symbols &amp; profit)</text>

      <rect x="275" y="190" width="255" height="50" rx="8" fill="#111827" stroke="#374151"/>
      <text x="287" y="210" fill="#38bdf8" font-weight="700">/positions</text>
      <text x="287" y="228" fill="#9ca3af" font-size="11">Global open MT5 positions</text>

      <rect x="0" y="250" width="255" height="50" rx="8" fill="#111827" stroke="#374151"/>
      <text x="12" y="270" fill="#38bdf8" font-weight="700">/performance</text>
      <text x="12" y="288" fill="#9ca3af" font-size="11">Profit ranking &amp; best traders</text>

      <rect x="275" y="250" width="255" height="50" rx="8" fill="#111827" stroke="#374151"/>
      <text x="287" y="270" fill="#38bdf8" font-weight="700">/close {symbol}</text>
      <text x="287" y="228" fill="#9ca3af" font-size="11">Emergency trade execution</text>

      <!-- Multi-Symbol pill -->
      <rect x="0" y="320" width="530" height="90" rx="10" fill="#0f172a" stroke="#2563eb" stroke-opacity="0.4"/>
      <text x="16" y="345" fill="#e2e8f0" font-weight="700">⚡ MULTI-SYMBOL &amp; CAPITAL PRESERVATION</text>
      <text x="16" y="368" fill="#94a3b8" font-size="11">Forex · Metals · Crypto · Indices with calculated risk-to-reward ratio.</text>
      <text x="16" y="388" fill="#38bdf8" font-size="11">Published on MQL5 Market: mql5.com/en/market/product/180408</text>
    </g>
  </g>
