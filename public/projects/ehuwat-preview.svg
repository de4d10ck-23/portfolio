<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#042f2e"/>
      <stop offset="45%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <radialGradient id="radarSweep" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#10b981" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="760" fill="url(#bg)"/>

  <!-- Radar Concentric Grid -->
  <g stroke="#34d399" stroke-opacity="0.15" stroke-width="1.5">
    <circle cx="450" cy="420" r="80" fill="none"/>
    <circle cx="450" cy="420" r="160" fill="none" stroke-dasharray="6 6"/>
    <circle cx="450" cy="420" r="240" fill="none"/>
    <circle cx="450" cy="420" r="320" fill="none" stroke-dasharray="8 8"/>
    <line x1="450" y1="80" x2="450" y2="740" stroke-opacity="0.12"/>
    <line x1="110" y1="420" x2="790" y2="420" stroke-opacity="0.12"/>
    <line x1="220" y1="190" x2="680" y2="650" stroke-opacity="0.08"/>
    <line x1="220" y1="650" x2="680" y2="190" stroke-opacity="0.08"/>
  </g>

  <!-- Radar Pulse Glow -->
  <circle cx="450" cy="420" r="260" fill="url(#radarSweep)"/>

  <!-- Top App Window Frame -->
  <rect x="50" y="40" width="1100" height="680" rx="24" fill="#022c22" fill-opacity="0.8" stroke="#10b981" stroke-opacity="0.35" stroke-width="2"/>
  
  <!-- Header Bar -->
  <rect x="50" y="40" width="1100" height="56" rx="24" fill="#064e3b" stroke="#10b981" stroke-opacity="0.2" stroke-width="1"/>
  <circle cx="84" cy="68" r="7" fill="#ef4444"/>
  <circle cx="106" cy="68" r="7" fill="#f59e0b"/>
  <circle cx="128" cy="68" r="7" fill="#10b981"/>
  
  <!-- URL Pill -->
  <rect x="360" y="52" width="480" height="32" rx="10" fill="#022c22" stroke="#10b981" stroke-opacity="0.3"/>
  <circle cx="380" cy="68" r="5" fill="#10b981"/>
  <text x="600" y="73" fill="#a7f3d0" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">http://ehuwat.tortor.org — Live Transit Radar</text>

  <!-- Left Map & Radar View -->
  <rect x="80" y="120" width="680" height="570" rx="18" fill="#033428" stroke="#047857" stroke-width="1.5"/>
  
  <!-- Simulated Roads / Streets of Sogod -->
  <path d="M110 420 Q320 380 450 420 T720 390" stroke="#065f46" stroke-width="12" fill="none"/>
  <path d="M450 140 Q430 310 450 420 T480 670" stroke="#065f46" stroke-width="12" fill="none"/>
  <path d="M200 240 L690 560" stroke="#065f46" stroke-width="8" fill="none"/>
  <path d="M110 420 Q320 380 450 420 T720 390" stroke="#34d399" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="6 6" fill="none"/>

  <!-- Active Vehicle Pins -->
  <!-- Tricycle 1 -->
  <g transform="translate(340, 370)">
    <circle cx="0" cy="0" r="20" fill="#10b981" fill-opacity="0.2"/>
    <circle cx="0" cy="0" r="8" fill="#10b981" stroke="#ffffff" stroke-width="2"/>
    <rect x="-60" y="-34" width="120" height="24" rx="6" fill="#022c22" stroke="#10b981" stroke-width="1.2"/>
    <text x="0" y="-18" fill="#d1fae5" font-family="Inter, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Tricycle #042 (2 min)</text>
  </g>

  <!-- Multicab -->
  <g transform="translate(560, 410)">
    <circle cx="0" cy="0" r="22" fill="#38bdf8" fill-opacity="0.2"/>
    <circle cx="0" cy="0" r="8" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>
    <rect x="-65" y="-34" width="130" height="24" rx="6" fill="#022c22" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="0" y="-18" fill="#e0f2fe" font-family="Inter, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Multicab: Sogod-Bontoc</text>
  </g>

  <!-- SLSU Waiting Commuter Pin (Ga-Huwat Ko!) -->
  <g transform="translate(450, 420)">
    <circle cx="0" cy="0" r="32" fill="#f59e0b" fill-opacity="0.3"/>
    <circle cx="0" cy="0" r="11" fill="#f59e0b" stroke="#ffffff" stroke-width="3"/>
    <rect x="-80" y="-42" width="160" height="28" rx="8" fill="#1e1b4b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="0" y="-23" fill="#fef3c7" font-family="Inter, sans-serif" font-size="11" font-weight="800" text-anchor="middle">Ga-Huwat Ko! @ SLSU</text>
  </g>

  <!-- Bus Pin -->
  <g transform="translate(480, 580)">
    <circle cx="0" cy="0" r="20" fill="#ec4899" fill-opacity="0.2"/>
    <circle cx="0" cy="0" r="8" fill="#ec4899" stroke="#ffffff" stroke-width="2"/>
    <rect x="-65" y="-34" width="130" height="24" rx="6" fill="#022c22" stroke="#ec4899" stroke-width="1.2"/>
    <text x="0" y="-18" fill="#fce7f3" font-family="Inter, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Bus: Tacloban - Maasin</text>
  </g>

  <!-- Live Pulse Badge -->
  <g transform="translate(110, 150)">
    <rect width="150" height="32" rx="16" fill="#022c22" stroke="#10b981" stroke-width="1"/>
    <circle cx="20" cy="16" r="5" fill="#10b981"/>
    <circle cx="20" cy="16" r="8" fill="#10b981" fill-opacity="0.4"/>
    <text x="78" y="21" fill="#a7f3d0" font-family="Inter, sans-serif" font-size="11" font-weight="800">RADAR ACTIVE</text>
  </g>

  <!-- Right Sidebar Panel: Hailing & Controls -->
  <rect x="780" y="120" width="340" height="570" rx="18" fill="#033428" stroke="#047857" stroke-width="1.5"/>

  <g transform="translate(805, 150)">
    <text x="0" y="20" fill="#ffffff" font-family="Inter, sans-serif" font-size="18" font-weight="800">E-HUWAT RADAR</text>
    <text x="0" y="40" fill="#34d399" font-family="Inter, sans-serif" font-size="11" font-weight="600">Sogod Community Transit</text>

    <!-- Hailing Broadcast Action Box -->
    <rect x="0" y="65" width="290" height="140" rx="14" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
    <text x="20" y="95" fill="#f59e0b" font-family="Inter, sans-serif" font-size="13" font-weight="800">Broadcast 'Ga-Huwat Ko!'</text>
    <text x="20" y="118" fill="#d1fae5" font-family="Inter, sans-serif" font-size="11" font-weight="500">Pins your live GPS for nearby drivers:</text>
    <text x="20" y="136" fill="#93c5fd" font-family="Inter, sans-serif" font-size="10" font-weight="600">• SLSU Sogod Campus (Brgy. San Roque)</text>
    
    <rect x="20" y="150" width="250" height="36" rx="8" fill="#10b981"/>
    <text x="145" y="173" fill="#022c22" font-family="Inter, sans-serif" font-size="12" font-weight="800" text-anchor="middle">Broadcast GPS Location</text>

    <!-- Live Stats -->
    <rect x="0" y="225" width="290" height="75" rx="12" fill="#022c22" stroke="#065f46"/>
    <text x="20" y="250" fill="#94a3b8" font-family="Inter, sans-serif" font-size="10" font-weight="700" letter-spacing="1">TRANSIT VEHICLES NEARBY</text>
    <text x="20" y="280" fill="#ffffff" font-family="Inter, sans-serif" font-size="20" font-weight="900">14 <tspan font-size="12" fill="#10b981" font-weight="600">Tricycles · Multicabs · Vans</tspan></text>

    <!-- Route Selector -->
    <rect x="0" y="320" width="290" height="120" rx="12" fill="#022c22" stroke="#065f46"/>
    <text x="20" y="345" fill="#94a3b8" font-family="Inter, sans-serif" font-size="10" font-weight="700" letter-spacing="1">MUNICIPALITY DESTINATION</text>
    
    <rect x="20" y="360" width="250" height="30" rx="6" fill="#064e3b"/>
    <text x="32" y="380" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="11" font-weight="600">Sogod to Bontoc / Maasin</text>

    <rect x="20" y="398" width="250" height="30" rx="6" fill="#064e3b"/>
    <text x="32" y="418" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="11" font-weight="600">Brgy. Poblacion to SLSU Campus</text>

    <!-- Status Pill -->
    <rect x="0" y="460" width="290" height="44" rx="10" fill="#042f2e" stroke="#10b981" stroke-opacity="0.3"/>
    <circle cx="24" cy="482" r="4" fill="#10b981"/>
    <text x="38" y="486" fill="#34d399" font-family="Inter, sans-serif" font-size="11" font-weight="700">Ongoing Project · PWA Ready</text>
  </g>
</svg>