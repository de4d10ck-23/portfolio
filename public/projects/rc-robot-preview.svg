<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" fill="none">
  <defs>
    <linearGradient id="rcBg" x1="0" y1="0" x2="1200" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="760" fill="url(#rcBg)"/>

  <!-- Distance Grid Track -->
  <g stroke="#818cf8" stroke-opacity="0.18" stroke-width="1.5" stroke-dasharray="6 6">
    <line x1="80" y1="650" x2="1120" y2="650"/>
    <line x1="80" y1="550" x2="1120" y2="550"/>
  </g>

  <!-- Main Card -->
  <rect x="70" y="70" width="1060" height="620" rx="26" fill="#0f172a" fill-opacity="0.88" stroke="#6366f1" stroke-opacity="0.45" stroke-width="2"/>

  <!-- Left Info & Odometry Telemetry -->
  <text x="115" y="135" fill="#818cf8" font-family="Inter, sans-serif" font-size="12" font-weight="800" letter-spacing="2">3RD YEAR STUDENT COMMISSION · ROBOTICS</text>
  <text x="115" y="176" fill="#ffffff" font-family="Inter, sans-serif" font-size="30" font-weight="800">Mini RC Robot + Distance Odometry</text>
  <text x="115" y="208" fill="#94a3b8" font-family="Inter, sans-serif" font-size="15">Smartphone Remote Control · Servo Motor Kinematics · Real-Time Distance Calculator</text>

  <!-- Odometry Readout Box -->
  <rect x="115" y="242" width="460" height="190" rx="18" fill="#1e293b" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="145" y="280" fill="#a5b4fc" font-family="Inter, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">SERVO MOTOR DISTANCE CALCULATOR</text>
  <text x="145" y="346" fill="#38bdf8" font-family="monospace" font-size="52" font-weight="800">14.85 m</text>
  <text x="145" y="382" fill="#10b981" font-family="Inter, sans-serif" font-size="14" font-weight="700">● Servo Rotation Pulses: 472 rev · Wheel Circumference: 31.4 cm</text>
  <text x="145" y="408" fill="#94a3b8" font-family="Inter, sans-serif" font-size="13">Formula: Distance = (Servo_Steps / Steps_Per_Rev) × (π × D)</text>

  <!-- Bottom Left Specs -->
  <rect x="115" y="456" width="220" height="175" rx="16" fill="#1e293b"/>
  <text x="140" y="492" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12" font-weight="700">ACTUATION</text>
  <text x="140" y="530" fill="#ffffff" font-family="Inter, sans-serif" font-size="22" font-weight="800">Servo Motors</text>
  <text x="140" y="560" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="13">PWM Angular &amp; Continuous</text>
  <text x="140" y="585" fill="#818cf8" font-family="Inter, sans-serif" font-size="12" font-weight="600">Precision Step Tracking</text>

  <rect x="355" y="456" width="220" height="175" rx="16" fill="#1e293b"/>
  <text x="380" y="492" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12" font-weight="700">CONTROLLER</text>
  <text x="380" y="530" fill="#ffffff" font-family="Inter, sans-serif" font-size="22" font-weight="800">Phone App UI</text>
  <text x="380" y="560" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="13">Directional Pad + Speed</text>
  <text x="380" y="585" fill="#34d399" font-family="Inter, sans-serif" font-size="12" font-weight="600">Zero-Latency Telemetry</text>

  <!-- Right Phone D-Pad + Robot Schematic -->
  <rect x="620" y="242" width="460" height="389" rx="22" fill="#1e293b" stroke="#334155"/>
  <text x="850" y="282" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="14" font-weight="700" text-anchor="middle">MOBILE REMOTE CONTROL INTERFACE</text>

  <!-- D-Pad Controls -->
  <g transform="translate(760, 430)">
    <rect x="-32" y="-95" width="64" height="56" rx="12" fill="#4f46e5"/>
    <text x="0" y="-60" fill="#ffffff" font-family="Inter, sans-serif" font-size="20" font-weight="800" text-anchor="middle">▲</text>
    <rect x="-32" y="39" width="64" height="56" rx="12" fill="#334155"/>
    <text x="0" y="74" fill="#ffffff" font-family="Inter, sans-serif" font-size="20" font-weight="800" text-anchor="middle">▼</text>
    <rect x="-98" y="-28" width="56" height="56" rx="12" fill="#334155"/>
    <text x="-70" y="7" fill="#ffffff" font-family="Inter, sans-serif" font-size="20" font-weight="800" text-anchor="middle">◀</text>
    <rect x="42" y="-28" width="56" height="56" rx="12" fill="#334155"/>
    <text x="70" y="7" fill="#ffffff" font-family="Inter, sans-serif" font-size="20" font-weight="800" text-anchor="middle">▶</text>
    <circle cx="0" cy="0" r="24" fill="#0f172a" stroke="#818cf8" stroke-width="2"/>
  </g>

  <!-- Right Side Telemetry Gauges -->
  <rect x="900" y="335" width="150" height="82" rx="12" fill="#0f172a" stroke="#38bdf8"/>
  <text x="975" y="365" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11" font-weight="700" text-anchor="middle">SPEED</text>
  <text x="975" y="398" fill="#38bdf8" font-family="monospace" font-size="22" font-weight="800" text-anchor="middle">0.42 m/s</text>

  <rect x="900" y="435" width="150" height="82" rx="12" fill="#0f172a" stroke="#10b981"/>
  <text x="975" y="465" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11" font-weight="700" text-anchor="middle">RESET TRIP</text>
  <text x="975" y="498" fill="#10b981" font-family="Inter, sans-serif" font-size="16" font-weight="800" text-anchor="middle">ZERO ODOMETER</text>

  <text x="850" y="592" fill="#94a3b8" font-family="Inter, sans-serif" font-size="13" text-anchor="middle">Custom Commissioned Student Project · Built by John Lloyd Tortor</text>
</svg>

